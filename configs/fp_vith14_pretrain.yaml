# Stage 1: self-supervised I-JEPA continued pretraining on ALL fingerprint data
# (fin-jepa/dataset/pretrain_manifest.csv: LivDet live + FVC Db1-3 + NIST302a/b-slap-seg/d).
#   python main.py --fname configs/fp_vith14_pretrain.yaml --devices cuda:0
# Stage 2: configs/fp_vith14_ft.yaml loads logs/fp_vith14_pretrain/jepa-latest.pth.tar.
data:
  manifest: /home/aidev/workspace/fin-jepa/dataset/pretrain_manifest.csv
  split: train                 # pretrain_split column (identity-disjoint ~2% val held out)
  datasets: null               # null = all; or e.g. [NIST302a, NIST302b, NIST302d, FVC2000]
  # keep the fine-tune TEST images out of pretraining so the LivDet evaluation stays unseen
  exclude_livdet_test: true
  livdet_manifest: /home/aidev/workspace/fin-jepa/dataset/manifest.csv
  livdet_images: /home/aidev/workspace/fin-jepa/dataset/images
  fin_jepa_root: /home/aidev/workspace/fin-jepa/scratch   # fp_preprocess.foreground_crop
  canvas: 256                  # 500 ppi foreground window, then RandomCrop(crop_size) (as in fine-tune)
  crop_size: 224
  crop_scale: [1.0, 1.0]       # unused for the manifest loader (no RandomResizedCrop)
  batch_size: 8               # per GPU
  num_workers: 8
  pin_mem: true
  root_path: null
  image_folder: null
  use_color_distortion: false
  use_gaussian_blur: false
  use_horizontal_flip: false
  color_jitter_strength: 0.0
logging:
  folder: logs/fp_vith14_pretrain
  write_tag: jepa
mask:
  allow_overlap: false
  aspect_ratio: [0.75, 1.5]
  enc_mask_scale: [0.85, 1.0]
  min_keep: 10
  num_enc_masks: 1
  num_pred_masks: 4
  patch_size: 14
  pred_mask_scale: [0.15, 0.2]
meta:
  copy_data: false
  load_checkpoint: false       # true resumes from logging.folder/jepa-latest.pth.tar
  read_checkpoint: null
  model_name: vit_huge
  pred_depth: 12
  pred_emb_dim: 384
  use_bfloat16: true
  # continue from the IN1K I-JEPA encoder (45k images is too few to train ViT-H from scratch);
  # the predictor is not in the HF weights and starts from random init
  init_encoder: pretrained/model.safetensors
  n_frozen: 20                 # of 32 blocks; full ViT-H + EMA target + AdamW does not fit 16 GB
optimization:
  ema: [0.996, 1.0]
  epochs: 50
  warmup: 5
  start_lr: 2.0e-5
  lr: 1.0e-4                   # lower than from-scratch (1e-3): encoder is already trained
  final_lr: 1.0e-6
  weight_decay: 0.04
  final_weight_decay: 0.4
  ipe_scale: 1.0
